<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Web3D Viewer — 单文件 OBJ 模型查看器</title>
    <meta name="description" content="单文件 Web 端 OBJ 模型查看器：把 .obj + .mtl + 贴图打包成 ZIP，浏览器打开即可预览，带贴图匹配日志。" />
    <meta property="og:title" content="Web3D Viewer — 单文件 OBJ 查看器" />
    <meta property="og:description" content="Drop a ZIP with .obj + .mtl + textures and preview it in the browser. Single HTML file, no build, no backend." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d14'/%3E%3Cpath d='M32 12 52 23v18L32 52 12 41V23z' fill='none' stroke='%236699ff' stroke-width='3'/%3E%3Cpath d='M12 23l20 11 20-11M32 34v18' fill='none' stroke='%236699ff' stroke-width='2.5' opacity='.75'/%3E%3C/svg%3E" />
    <style>
        :root {
            --bg: #141414;
            --panel: #1b1b1b;
            --panel-hi: #242424;
            --panel-hover: #2b2b2b;
            --line: #2c2c2c;
            --line-hi: #3a3a3a;
            --fg: #d6d6d6;
            --fg-dim: #8c8c8c;
            --fg-faint: #565656;
            --accent: #e07b39;
            --ok: #78a878;
            --warn: #cfa04a;
            --err: #cc5f5f;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            font-size: 13px;
            overflow: hidden;
            touch-action: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- canvas ---------- */
        #canvas-container { position: fixed; inset: 0; }
        #canvas-container canvas { display: block; }
        body.dragging::after {
            content: '';
            position: fixed;
            inset: 8px;
            border: 1px dashed var(--accent);
            pointer-events: none;
            z-index: 500;
        }

        /* ---------- 顶部栏 ---------- */
        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            z-index: 200;
        }
        #topbar .brand {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .02em;
            color: var(--fg);
            white-space: nowrap;
        }
        #file-name {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--fg-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        #stats {
            margin-left: auto;
            display: flex;
            gap: 14px;
            font-size: 11px;
            color: var(--fg-dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        #stats b { color: var(--fg); font-weight: 500; }

        /* ---------- 底部栏 ---------- */
        #bottombar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--panel);
            border-top: 1px solid var(--line);
            z-index: 200;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #progress-wrap {
            height: 2px;
            background: #242424;
            opacity: 0;
            transition: opacity .2s;
        }
        #progress-wrap.active { opacity: 1; }
        #progress-bar {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width .15s linear;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .spacer { flex: 1; }

        /* ---------- 按钮 ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 30px;
            padding: 0 10px;
            background: var(--panel-hi);
            border: 1px solid var(--line-hi);
            border-radius: 2px;
            color: var(--fg);
            font-size: 12px;
            font-family: inherit;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
            transition: background .12s, border-color .12s, color .12s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background: var(--panel-hover); border-color: #484848; }
        .btn:active { background: #333; }
        .btn svg { width: 15px; height: 15px; flex: none; }
        .btn.icon { width: 32px; padding: 0; }
        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #141414;
            font-weight: 600;
        }
        .btn.primary:hover { background: #ea8a4b; border-color: #ea8a4b; }
        .btn.on {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---------- 状态 ---------- */
        #status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--fg-dim);
            min-height: 14px;
            overflow: hidden;
        }
        #status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #status .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--ok);
            flex: none;
        }
        #status .dot.loading { background: var(--warn); }
        #status .dot.error { background: var(--err); }
        #status .dot.warning { background: var(--warn); }

        /* ---------- 空状态 ---------- */
        #empty-hint {
            position: fixed;
            inset: 44px 0 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--fg-faint);
            font-size: 13px;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #empty-hint svg { width: 44px; height: 44px; opacity: .5; }
        #empty-hint .sub { font-size: 11px; color: #464646; font-family: var(--mono); }

        /* ---------- 贴图日志面板 ---------- */
        #tex-log {
            position: fixed;
            top: 44px;
            right: 0;
            bottom: 0;
            width: 340px;
            max-width: 100%;
            background: var(--panel);
            border-left: 1px solid var(--line);
            overflow-y: auto;
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.55;
            z-index: 190;
            transform: translateX(100%);
            transition: transform .16s ease;
            overscroll-behavior: contain;
        }
        #tex-log.show { transform: translateX(0); }
        #tex-log div {
            padding: 3px 10px;
            border-bottom: 1px solid #202020;
            word-break: break-all;
            color: var(--fg-dim);
        }
        #tex-log .ok { color: var(--ok); }
        #tex-log .fail { color: var(--err); }
        #tex-log .info { color: var(--fg-faint); }

        #zip-input { display: none; }

        @media (max-width: 560px) {
            #topbar { height: 40px; gap: 8px; padding: 0 10px; }
            #topbar .brand { display: none; }
            #stats { gap: 10px; font-size: 10px; }
            #empty-hint { inset: 40px 0 0 0; }
            #tex-log { top: 40px; width: 100%; }
            .btn { height: 28px; padding: 0 8px; font-size: 11px; }
            .btn.icon { width: 30px; }
            .btn svg { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="empty-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
            <path d="M12 2.6 21 7.4v9.2L12 21.4 3 16.6V7.4z" />
            <path d="M3 7.4l9 4.8 9-4.8M12 12.2v9.2" opacity=".55" />
        </svg>
        <div>拖入 ZIP，或点击「打开 ZIP」</div>
        <div class="sub">.obj + .mtl + textures</div>
    </div>

    <header id="topbar">
        <div class="brand">Web3D Viewer</div>
        <div id="file-name">未加载</div>
        <div id="stats">
            <span>顶点 <b id="poly-count">0</b></span>
            <span>三角面 <b id="tri-count">0</b></span>
        </div>
    </header>

    <div id="tex-log"></div>

    <footer id="bottombar">
        <div id="progress-wrap"><div id="progress-bar"></div></div>
        <div class="bar-row">
            <button id="btn-load" class="btn primary" title="打开 ZIP">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                    <path d="M3 6.5h6l1.5 2H21v10H3z" />
                </svg>
                <span>打开 ZIP</span>
            </button>
            <div class="spacer"></div>
            <button id="btn-grid" class="btn icon on" title="网格 (G)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18" />
                </svg>
            </button>
            <button id="btn-wire" class="btn icon" title="线框 (W)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                    <path d="M12 3l9 16H3z" />
                </svg>
            </button>
            <button id="btn-auto" class="btn icon" title="自动旋转 (空格)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M20 12a8 8 0 1 1-2.3-5.6" />
                    <path d="M20 4v4h-4" />
                </svg>
            </button>
            <button id="btn-reset" class="btn icon" title="重置视角 (R)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="2.4" />
                    <path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke-linecap="round" />
                </svg>
            </button>
            <button id="btn-shot" class="btn icon" title="截图 (S)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                    <path d="M3 8h4l1.6-2h6.8L17 8h4v11H3z" />
                    <circle cx="12" cy="13" r="3.2" />
                </svg>
            </button>
            <button id="btn-full" class="btn icon" title="全屏 (F)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
                </svg>
            </button>
            <button id="btn-debug" class="btn icon" title="贴图日志 (L)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M4 6h16M4 12h16M4 18h10" />
                </svg>
            </button>
        </div>
        <div id="status">
            <span class="dot"></span>
            <span id="status-text">就绪</span>
        </div>
    </footer>

    <input type="file" id="zip-input" accept=".zip" />

    <!-- Three.js 依赖源可用 ?cdn=jsdelivr|unpkg|npmmirror 切换；默认 jsDelivr -->
    <script>
        (function () {
            var SOURCES = {
                jsdelivr: 'https://cdn.jsdelivr.net/npm/three@0.163.0/',
                unpkg: 'https://unpkg.com/three@0.163.0/',
                npmmirror: 'https://registry.npmmirror.com/three/0.163.0/files/'
            };
            var ORDER = ['jsdelivr', 'unpkg', 'npmmirror'];
            var q = new URLSearchParams(location.search).get('cdn');
            var pick = SOURCES[q] ? q : ORDER[0];
            window.__CDN_KEY__ = pick;
            window.__CDN_ORDER__ = ORDER;
            document.write(
                '<script type="importmap">' +
                JSON.stringify({
                    imports: {
                        'three': SOURCES[pick] + 'build/three.module.js',
                        'three/addons/': SOURCES[pick] + 'examples/jsm/'
                    }
                }) +
                '<\/script>'
            );
        })();
    </script>

    <script type="module">
        // ============================================================
        //  模块导入
        // ============================================================
        // 动态导入：静态 import 失败时整个模块不执行、页面死寂无提示，这里换成可捕获的形式
        function showFatalLoad(err) {
            var cur = window.__CDN_KEY__ || 'jsdelivr';
            var alts = (window.__CDN_ORDER__ || []).filter(function (k) { return k !== cur; });
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(13,13,20,.96);z-index:9999;font-size:14px;line-height:1.7;';
            var title = document.createElement('div');
            title.style.cssText = 'font-size:16px;font-weight:600;color:#ff8a8a;';
            title.textContent = 'Three.js 加载失败';
            var detail = document.createElement('div');
            detail.style.cssText = 'max-width:460px;opacity:.82;';
            detail.textContent = '当前源：' + cur + '。可能是网络无法访问该 CDN。' +
                (err && err.message ? '错误：' + err.message : '');
            box.appendChild(title);
            box.appendChild(detail);
            alts.forEach(function (k) {
                var a = document.createElement('a');
                a.href = location.pathname + '?cdn=' + k;
                a.style.cssText = 'color:#8ab4ff;text-decoration:underline;';
                a.textContent = '用备用源重试：' + k;
                box.appendChild(a);
            });
            document.body.appendChild(box);
        }

        let THREE, OrbitControls, OBJLoader, TGALoader, DDSLoader;
        try {
            THREE = await import('three');
            ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
            ({ OBJLoader } = await import('three/addons/loaders/OBJLoader.js'));
            ({ TGALoader } = await import('three/addons/loaders/TGALoader.js'));
            ({ DDSLoader } = await import('three/addons/loaders/DDSLoader.js'));
        } catch (err) {
            showFatalLoad(err);
            throw err;
        }

        // ============================================================
        //  DOM 引用
        // ============================================================
        const container = document.getElementById('canvas-container');
        const zipInput = document.getElementById('zip-input');
        const btnLoad = document.getElementById('btn-load');
        const btnReset = document.getElementById('btn-reset');
        const btnAuto = document.getElementById('btn-auto');
        const btnDebug = document.getElementById('btn-debug');
        const statusText = document.getElementById('status-text');
        const statusDot = document.querySelector('#status .dot');
        const progressWrap = document.getElementById('progress-wrap');
        const progressBar = document.getElementById('progress-bar');
        const polyCountEl = document.getElementById('poly-count');
        const triCountEl = document.getElementById('tri-count');
        const emptyHint = document.getElementById('empty-hint');
        const texLog = document.getElementById('tex-log');
        const btnGrid = document.getElementById('btn-grid');
        const btnWire = document.getElementById('btn-wire');
        const btnShot = document.getElementById('btn-shot');
        const btnFull = document.getElementById('btn-full');
        const fileNameEl = document.getElementById('file-name');

        let texLogEntries = [];
        const TEX_LOG_KEEP = 500;   // 内存里保留的条数上限
        const TEX_LOG_RENDER = 40;  // 面板里渲染的条数
        let texLogPending = false;

        function logTex(msg, type = 'info') {
            texLogEntries.push({ msg, type });
            if (texLogEntries.length > TEX_LOG_KEEP) texLogEntries.shift();
            if (texLogPending) return;
            texLogPending = true;
            requestAnimationFrame(renderTexLog);
        }

        function renderTexLog() {
            texLogPending = false;
            const total = texLogEntries.length;
            const shown = texLogEntries.slice(-TEX_LOG_RENDER);
            const frag = document.createDocumentFragment();
            if (total > shown.length) {
                const head = document.createElement('div');
                head.className = 'info';
                head.textContent = `…共 ${total} 条，仅显示最后 ${shown.length} 条`;
                frag.appendChild(head);
            }
            for (const e of shown) {
                const row = document.createElement('div');
                row.className = e.type;
                // 用 textContent 而不是 innerHTML：ZIP 内的文件名可能带 HTML 标签
                row.textContent = e.msg;
                frag.appendChild(row);
            }
            texLog.replaceChildren(frag);
            texLog.scrollTop = texLog.scrollHeight;
        }

        // ============================================================
        //  Three.js 场景
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d14);

        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 500);
        camera.position.set(4, 3, 6);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance',
            // 截图要读回画布内容，必须保留绘制缓冲
            preserveDrawingBuffer: true,
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 0.5;
        controls.maxDistance = 150;
        controls.target.set(0, 0, 0);
        controls.update();

        // ---- 灯光 ----
        const ambient = new THREE.AmbientLight(0x40406b, 0.6);
        scene.add(ambient);

        const main = new THREE.DirectionalLight(0xffeedd, 1.8);
        main.position.set(8, 12, 6);
        scene.add(main);

        const fill = new THREE.DirectionalLight(0x4488ff, 0.6);
        fill.position.set(-6, 4, -8);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffaa66, 0.4);
        rim.position.set(0, -6, 10);
        scene.add(rim);

        const hemi = new THREE.HemisphereLight(0x6699ff, 0x443366, 0.5);
        scene.add(hemi);

        const grid = new THREE.GridHelper(8, 16, 0x445577, 0x223355);
        grid.position.y = -0.5;
        scene.add(grid);

        // ============================================================
        //  状态
        // ============================================================
        let currentModel = null;
        let autoRotate = false;
        let isLoading = false;

        // 当前模型引用的 blob URL，切换模型时统一 revoke
        let activeBlobUrls = [];
        // blob URL → { name, ext }，用于按扩展名选择纹理解码器
        const blobUrlMeta = new Map();
        // 按需渲染：只有视角或场景变化时才重绘
        let needsRender = true;
        const invalidate = () => { needsRender = true; };

        // ---- 环境光照：PBR 材质没有 envMap 时金属与高光会发死 ----
        (async () => {
            try {
                const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
                const pmrem = new THREE.PMREMGenerator(renderer);
                const envRT = pmrem.fromScene(new RoomEnvironment(renderer), 0.04);
                scene.environment = envRT.texture;
                scene.environmentIntensity = 0.45;
                pmrem.dispose();
                invalidate();
            } catch (e) {
                console.warn('环境贴图加载失败，已跳过：', e);
            }
        })();

        const MAX_ZIP_BYTES = 300 * 1024 * 1024;
        const MAX_UNZIP_BYTES = 600 * 1024 * 1024;

        // 视角变化时触发重绘
        controls.addEventListener('change', invalidate);

        // ============================================================
        //  工具
        // ============================================================
        function setStatus(msg, type = 'idle') {
            statusText.textContent = msg;
            statusDot.className = 'dot';
            if (type === 'loading') statusDot.classList.add('loading');
            if (type === 'error') statusDot.classList.add('error');
            if (type === 'warning') statusDot.classList.add('warning');
        }

        function setProgress(pct) {
            if (pct < 0) {
                progressWrap.classList.remove('active');
                return;
            }
            progressWrap.classList.add('active');
            progressBar.style.width = Math.min(pct, 100) + '%';
        }

        function updateStats(model) {
            if (!model) {
                polyCountEl.textContent = '0';
                triCountEl.textContent = '0';
                return;
            }
            let verts = 0,
                tris = 0;
            model.traverse(child => {
                if (child.isMesh && child.geometry) {
                    const g = child.geometry;
                    if (g.index) {
                        tris += g.index.count / 3;
                    } else if (g.attributes.position) {
                        tris += g.attributes.position.count / 3;
                    }
                    if (g.attributes.position) {
                        verts += g.attributes.position.count;
                    }
                }
            });
            polyCountEl.textContent = Math.round(verts).toLocaleString();
            triCountEl.textContent = Math.round(tris).toLocaleString();

            // 高面数模型降低渲染分辨率，避免移动端掉帧
            const ratio = tris > 500000 ? 1 : Math.min(window.devicePixelRatio, 2);
            if (renderer.getPixelRatio() !== ratio) {
                renderer.setPixelRatio(ratio);
                renderer.setSize(container.clientWidth, container.clientHeight);
                invalidate();
            }
        }

        const TEXTURE_SLOTS = ['map', 'bumpMap', 'normalMap', 'specularMap',
            'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap'];

        // material.dispose() 不会连带释放贴图，需要逐个 dispose
        function disposeMaterial(mat) {
            if (!mat) return;
            for (const slot of TEXTURE_SLOTS) {
                const tex = mat[slot];
                if (tex && typeof tex.dispose === 'function') {
                    releaseTexture(tex);
                    mat[slot] = null;
                }
            }
            if (typeof mat.dispose === 'function') mat.dispose();
        }

        function disposeModel(model) {
            if (!model) return;
            model.traverse(child => {
                if (!child.isMesh) return;
                child.geometry?.dispose();
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const m of mats) disposeMaterial(m);
            });
            scene.remove(model);
        }

        function revokeBlobUrls(urls) {
            for (const url of urls) {
                URL.revokeObjectURL(url);
                blobUrlMeta.delete(url);
            }
        }

        // ============================================================
        //  动态加载 JSZip
        // ============================================================
        const JSZIP_CDNS = [
            'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
            'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
            'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
        ];

        function loadScriptFromAny(urls) {
            return new Promise((resolve, reject) => {
                const tryNext = (i) => {
                    if (i >= urls.length) {
                        reject(new Error('JSZip 加载失败：所有 CDN 均不可达'));
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = urls[i];
                    script.onload = () => resolve();
                    script.onerror = () => {
                        script.remove();
                        tryNext(i + 1);
                    };
                    document.head.appendChild(script);
                };
                tryNext(0);
            });
        }

        function loadJSZip() {
            if (window.JSZip) return Promise.resolve();
            return loadScriptFromAny(JSZIP_CDNS);
        }

        const TEXTURE_EXT_RE = /\.(jpg|jpeg|png|bmp|webp|gif|tga|dds)$/;

        async function unzipFile(file, onProgress) {
            await loadJSZip();
            const data = await file.arrayBuffer();
            const zip = await window.JSZip.loadAsync(data);
            const files = {};
            const urls = [];
            let totalBytes = 0;

            const names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
            let done = 0;

            try {
                for (const name of names) {
                    const entry = zip.files[name];
                    if (entry.dir) continue;
                    const lower = name.toLowerCase();
                    if (lower.endsWith('.obj') || lower.endsWith('.mtl')) {
                        files[name] = await entry.async('text');
                    } else if (TEXTURE_EXT_RE.test(lower)) {
                        const blob = await entry.async('blob');
                        totalBytes += blob.size;
                        if (totalBytes > MAX_UNZIP_BYTES) {
                            throw new Error(`解压后纹理体积超过 ${MAX_UNZIP_BYTES / 1024 / 1024} MB，已中止`);
                        }
                        const url = URL.createObjectURL(blob);
                        urls.push(url);
                        blobUrlMeta.set(url, { name, ext: lower.split('.').pop() });
                        files[name] = url;
                    }
                    done++;
                    if (onProgress) onProgress(done / names.length);
                }
            } catch (err) {
                revokeBlobUrls(urls);
                throw err;
            }

            return { files, urls };
        }

        // 按扩展名选择解码器：浏览器原生只能解 jpg/png/webp/bmp/gif，tga 和 dds 需要专用 loader
        // key -> { tex, refs }：同一张图只解码一次
        // 键包含色彩空间：同一张图作为基色（sRGB）和法线/高度（线性）引用时不能共用一个 Texture
        const texturePool = new Map();

        function loadTextureByUrl(url, srgb = true) {
            const key = url + (srgb ? '|s' : '|l');
            const cached = texturePool.get(key);
            if (cached) {
                cached.refs++;
                return cached.tex;
            }

            // 同一张图已按另一种色彩空间加载过：clone 一份共享 image，不重复解码
            for (const [k, rec] of texturePool) {
                if (k.startsWith(url + '|')) {
                    const copy = rec.tex.clone();
                    copy.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
                    copy.needsUpdate = true;
                    texturePool.set(key, { tex: copy, refs: 1 });
                    return copy;
                }
            }

            const meta = blobUrlMeta.get(url);
            const ext = meta ? meta.ext : '';

            const onLoad = (tex) => {
                const img = tex && tex.image;
                if (img && img.width) {
                    const maxTex = renderer.capabilities.maxTextureSize;
                    if (Math.max(img.width, img.height) > maxTex) {
                        logTex(`${meta ? meta.name : '纹理'} 尺寸 ${img.width}×${img.height} 超过设备上限 ${maxTex}，已关闭 mipmap`, 'fail');
                        tex.generateMipmaps = false;
                        tex.minFilter = THREE.LinearFilter;
                        tex.needsUpdate = true;
                    }
                }
                invalidate();
            };

            let tex;
            if (ext === 'tga') tex = new TGALoader().load(url, onLoad);
            else if (ext === 'dds') tex = new DDSLoader().load(url, onLoad);
            else tex = new THREE.TextureLoader().load(url, onLoad);

            tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
            texturePool.set(key, { tex, refs: 1 });
            return tex;
        }

        // 引用计数归零才真正释放，避免多个材质共用贴图时被提前销毁
        function releaseTexture(tex) {
            if (!tex) return;
            for (const [url, rec] of texturePool) {
                if (rec.tex === tex) {
                    rec.refs--;
                    if (rec.refs <= 0) {
                        tex.dispose();
                        texturePool.delete(url);
                    }
                    return;
                }
            }
            if (typeof tex.dispose === 'function') tex.dispose();
        }

        // ============================================================
        //   核心：智能匹配纹理 (加强版)
        // ============================================================
        function findTextureSmart(mtlTexName, texMap, allTexNames) {
            // 清理路径
            let clean = mtlTexName.replace(/^.*[\\\/]/, '').trim();
            // 去掉可能带引号
            clean = clean.replace(/^["']|["']$/g, '');
            const lower = clean.toLowerCase();

            // 1. 精确匹配
            if (texMap[lower]) return texMap[lower];
            if (texMap[clean]) return texMap[clean];

            // 2. 去掉扩展名匹配
            const baseNoExt = lower.replace(/\.[^.]+$/, '');
            for (const key in texMap) {
                const keyBase = key.replace(/^.*[\\\/]/, '').toLowerCase().replace(/\.[^.]+$/, '');
                if (keyBase === baseNoExt) {
                    logTex(`匹配: "${clean}" → "${key}"`, 'ok');
                    return texMap[key];
                }
            }

            // 3. 模糊匹配 (包含关系)
            for (const key in texMap) {
                const keyBase = key.replace(/^.*[\\\/]/, '').toLowerCase();
                if (keyBase.includes(baseNoExt) || baseNoExt.includes(keyBase.replace(/\.[^.]+$/, ''))) {
                    logTex(`模糊匹配: "${clean}" → "${key}"`, 'ok');
                    return texMap[key];
                }
            }

            // 4. 如果纹理名是数字或简单名，尝试找唯一纹理
            if (allTexNames.length === 1) {
                logTex(`只有一张贴图，直接使用`, 'ok');
                return texMap[allTexNames[0]];
            }

            logTex(`未找到: "${clean}"`, 'fail');
            return null;
        }

        // ============================================================
        //  加载 ZIP
        // ============================================================
        async function loadZip(file) {
            if (isLoading) return;

            if (file.size > MAX_ZIP_BYTES) {
                setStatus(`ZIP 超过 ${MAX_ZIP_BYTES / 1024 / 1024} MB，请精简后再试`, 'error');
                return;
            }

            isLoading = true;
            fileNameEl.textContent = file.name;
            fileNameEl.title = file.name;
            texLogEntries = [];
            renderTexLog();
            if (file.size > 80 * 1024 * 1024) {
                logTex(`ZIP 体积 ${(file.size / 1024 / 1024).toFixed(0)} MB，移动端解析可能因内存不足失败`, 'fail');
            }
            setStatus('解压中...', 'loading');
            setProgress(10);

            let pending = null;
            try {
                pending = await unzipFile(file, (p) => setProgress(10 + p * 30));
                const files = pending.files;
                setProgress(40);

                let objText = null;
                let mtlText = null;
                const mtlNames = [];
                const texMap = {};
                const allTexNames = [];

                for (const name in files) {
                    const lower = name.toLowerCase();
                    const value = files[name];
                    if (lower.endsWith('.obj')) {
                        if (objText) logTex(`ZIP 内有多个 .obj，使用最后一个: ${name}`, 'fail');
                        objText = value;
                    } else if (lower.endsWith('.mtl')) {
                        mtlNames.push(name);
                        mtlText = value;
                    } else if (typeof value === 'string' && value.startsWith('blob:')) {
                        const base = name.split(/[\\\/]/).pop();
                        if (texMap[base] && texMap[base] !== value) {
                            logTex(`贴图重名：${base} 有多份，已用 ${name} 覆盖前一份`, 'fail');
                        }
                        texMap[base] = value;
                        texMap[lower] = value;
                        texMap[base.toLowerCase()] = value;
                        texMap[lower.toLowerCase()] = value;
                        allTexNames.push(base);
                        logTex(`纹理: ${base}`, 'info');
                    }
                }

                if (mtlNames.length > 1) {
                    const used = mtlNames[mtlNames.length - 1];
                    const ignored = mtlNames.slice(0, -1).join(', ');
                    logTex(`ZIP 内有 ${mtlNames.length} 个 .mtl，只使用 "${used}"，已忽略: ${ignored}`, 'fail');
                }

                if (!objText) {
                    setStatus('ZIP 中没有 .obj 文件', 'error');
                    revokeBlobUrls(pending.urls);
                    isLoading = false;
                    setProgress(-1);
                    return;
                }

                setStatus('解析模型...', 'loading');
                setProgress(50);

                const loader = new OBJLoader();
                const obj = loader.parse(objText);

                // ---- 解析 MTL ----
                let matCount = 0;
                let texMatched = 0;
                if (mtlText) {
                    const result = parseMTLWithLog(mtlText, texMap, allTexNames);
                    const mats = result.materials;
                    texMatched = result.matched;
                    matCount = Object.keys(mats).length;
                    applyMaterials(obj, mats);
                }

                setProgress(80);

                // ---- 居中 ----
                const box = new THREE.Box3().setFromObject(obj);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                obj.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);

                // 网格贴合模型底部（固定 y=-0.5 会插在模型中间）
                grid.position.y = (box.min.y - center.y) - maxDim * 0.02;
                const dist = Math.max(maxDim * 1.8, 1.5);
                camera.position.set(dist * 0.7, dist * 0.5, dist);
                // 按模型尺寸调整裁剪面与缩放范围，避免大模型被 far 裁掉
                camera.near = Math.max(dist / 1000, 0.01);
                camera.far = dist * 100;
                camera.updateProjectionMatrix();
                controls.maxDistance = dist * 10;
                controls.target.set(0, 0, 0);
                controls.update();

                disposeModel(currentModel);
                revokeBlobUrls(activeBlobUrls);
                activeBlobUrls = pending.urls;
                scene.add(obj);
                currentModel = obj;
                invalidate();

                updateStats(obj);
                if (wireframe) applyWireframe(obj);
                setProgress(100);

                const texStatus = texMatched > 0 ? `${texMatched}张贴图` : '无贴图';
                setStatus(`${matCount}材质 · ${texStatus}`, texMatched > 0 ? 'idle' : 'warning');
                emptyHint.style.display = 'none';

                if (texMatched === 0 && allTexNames.length > 0) {
                    logTex(`有 ${allTexNames.length} 张贴图但未匹配，尝试手动匹配`, 'fail');
                }

                setTimeout(() => setProgress(-1), 800);

            } catch (err) {
                console.error(err);
                if (pending) revokeBlobUrls(pending.urls);
                setStatus('' + err.message, 'error');
                setProgress(-1);
            }

            isLoading = false;
        }

        // ============================================================
        //  解析 MTL (带日志)
        // ============================================================
        function parseMTLWithLog(text, texMap, allTexNames) {
            const mats = {};
            const lines = text.split(/\r?\n/);
            let current = null;
            let matched = 0;

            for (const raw of lines) {
                const line = raw.trim();
                if (!line || line.startsWith('#')) continue;
                const parts = line.split(/\s+/);
                const cmd = parts[0];

                if (cmd === 'newmtl') {
                    const name = parts.slice(1).join(' ');
                    current = name;
                    mats[name] = new THREE.MeshStandardMaterial({
                        name: name,
                        roughness: 0.6,
                        metalness: 0.1,
                        color: 0xccccdd,
                    });
                } else if (cmd === 'Kd' && current) {
                    const r = parseFloat(parts[1]);
                    const g = parseFloat(parts[2]);
                    const b = parseFloat(parts[3]);
                    if (!isNaN(r + g + b)) {
                        // MTL 的 Kd 是 sRGB 值，不声明会被当线性值，模型整体发亮发白
                        mats[current].color.setRGB(r, g, b, THREE.SRGBColorSpace);
                    }
                } else if (cmd === 'Ns' && current) {
                    const val = parseFloat(parts[1]);
                    if (!isNaN(val)) {
                        mats[current].roughness = Math.max(0, 1 - val / 1000);
                    }
                } else if (cmd === 'd' && current) {
                    const val = parseFloat(parts[1]);
                    if (!isNaN(val)) {
                        mats[current].opacity = val;
                        mats[current].transparent = val < 1;
                    }
                } else if (cmd === 'Tr' && current) {
                    // 老式 MTL 用 Tr 表示透明度（Tr = 1 - d）
                    const val = parseFloat(parts[1]);
                    if (!isNaN(val)) {
                        const opacity = Math.max(0, Math.min(1, 1 - val));
                        mats[current].opacity = opacity;
                        mats[current].transparent = opacity < 1;
                    }
                } else if (cmd === 'map_Kd' && current) {
                    const texName = parts.slice(1).join(' ');
                    const match = findTextureSmart(texName, texMap, allTexNames);
                    if (match) {
                        const tex = loadTextureByUrl(match, true);
                        mats[current].map = tex;
                        mats[current].needsUpdate = true;
                        matched++;
                        logTex(`${current} → 贴图已应用`, 'ok');
                    } else {
                        logTex(`${current} → 贴图缺失: ${texName}`, 'fail');
                    }
                } else if ((cmd === 'map_bump' || cmd === 'bump') && current) {
                    const texName = parts.slice(1).join(' ');
                    const match = findTextureSmart(texName, texMap, allTexNames);
                    if (match) {
                        const tex = loadTextureByUrl(match, false);
                        mats[current].bumpMap = tex;
                        mats[current].bumpScale = 0.5;
                        mats[current].needsUpdate = true;
                        matched++;
                    }
                } else if (cmd === 'map_Ks' && current) {
                    // 高光贴图 -> 粗糙度贴图 (近似，两者语义并不等价)
                    const texName = parts.slice(1).join(' ');
                    const match = findTextureSmart(texName, texMap, allTexNames);
                    if (match) {
                        const tex = loadTextureByUrl(match, false);
                        mats[current].roughnessMap = tex;
                        mats[current].needsUpdate = true;
                        matched++;
                        logTex(`${current} → 高光贴图已按粗糙度近似处理`, 'info');
                    }
                } else if ((cmd === 'norm' || cmd === 'map_Kn' || cmd === 'map_normal') && current) {
                    // 法线贴图是数据贴图，必须保持线性色彩空间
                    const texName = parts.slice(1).join(' ');
                    const match = findTextureSmart(texName, texMap, allTexNames);
                    if (match) {
                        const tex = loadTextureByUrl(match, false);
                        mats[current].normalMap = tex;
                        mats[current].needsUpdate = true;
                        matched++;
                        logTex(`${current} → 法线贴图已应用`, 'ok');
                    }
                } else if ((cmd === 'map_d' || cmd === 'map_alpha') && current) {
                    const texName = parts.slice(1).join(' ');
                    const match = findTextureSmart(texName, texMap, allTexNames);
                    if (match) {
                        const tex = loadTextureByUrl(match, false);
                        mats[current].alphaMap = tex;
                        mats[current].transparent = true;
                        mats[current].needsUpdate = true;
                        matched++;
                        logTex(`${current} → alpha 贴图已应用`, 'ok');
                    }
                } else if (cmd === 'Ke' && current) {
                    const r = parseFloat(parts[1]);
                    const g = parseFloat(parts[2]);
                    const b = parseFloat(parts[3]);
                    if (!isNaN(r + g + b)) {
                        mats[current].emissive.setRGB(r, g, b, THREE.SRGBColorSpace);
                        mats[current].emissiveIntensity = 1;
                    }
                } else if (cmd === 'map_Ke' && current) {
                    const texName = parts.slice(1).join(' ');
                    const match = findTextureSmart(texName, texMap, allTexNames);
                    if (match) {
                        const tex = loadTextureByUrl(match, true);
                        mats[current].emissiveMap = tex;
                        mats[current].needsUpdate = true;
                        matched++;
                    }
                }
            }

            return { materials: mats, matched };
        }

        let wireframe = false;

        function applyWireframe(model) {
            if (!model) return;
            model.traverse(child => {
                if (!child.isMesh) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const m of mats) {
                    if (m) m.wireframe = wireframe;
                }
            });
            invalidate();
        }

        function applyMaterials(obj, mats) {
            const warned = new Set();
            obj.traverse(child => {
                if (child.isMesh) {
                    const oldMat = child.material;
                    let matName = null;
                    if (oldMat) {
                        matName = oldMat.name || oldMat.uuid;
                    }
                    if (matName && mats[matName]) {
                        child.material = mats[matName];
                    } else {
                        // 尝试匹配材质名 (去除数字后缀等)
                        for (const key in mats) {
                            if (matName && (key.includes(matName) || matName.includes(key))) {
                                child.material = mats[key];
                                break;
                            }
                        }
                        // 如果还没匹配，用第一个（并告警，不静默错配）
                        if (!child.material || child.material === oldMat) {
                            const keys = Object.keys(mats);
                            if (keys.length > 0) {
                                child.material = mats[keys[0]];
                                const key = matName || '(未命名)';
                                if (!warned.has(key)) {
                                    warned.add(key);
                                    logTex(`材质 "${key}" 未在 MTL 中找到，已套用第一个材质 "${keys[0]}"`, 'fail');
                                }
                            }
                        }
                    }
                    if (child.material && child.material !== oldMat) {
                        disposeMaterial(oldMat);
                        child.material.needsUpdate = true;
                    } else if (child.material) {
                        child.material.needsUpdate = true;
                    }
                }
            });
        }

        // ============================================================
        //  事件
        // ============================================================
        btnLoad.addEventListener('click', () => {
            zipInput.click();
        });

        zipInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadZip(e.target.files[0]);
            }
            zipInput.value = '';
        });

        btnReset.addEventListener('click', () => {
            if (currentModel) {
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const dist = Math.max(maxDim * 1.8, 1.5);
                camera.position.set(dist * 0.7, dist * 0.5, dist);
                controls.target.set(0, 0, 0);
                controls.update();
            } else {
                camera.position.set(4, 3, 6);
                controls.target.set(0, 0, 0);
                controls.update();
            }
            setStatus('视角已重置', 'idle');
            invalidate();
        });

        btnAuto.addEventListener('click', () => {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 2.0;
            btnAuto.classList.toggle('on', autoRotate);
        });

        // ---- 贴图调试按钮 ----
        btnDebug.addEventListener('click', () => {
            const on = texLog.classList.toggle('show');
            btnDebug.classList.toggle('on', on);
        });

        // ---- 网格开关 ----
        btnGrid.addEventListener('click', () => {
            grid.visible = !grid.visible;
            btnGrid.classList.toggle('on', grid.visible);
            invalidate();
        });

        // ---- 线框 ----
        btnWire.addEventListener('click', () => {
            wireframe = !wireframe;
            btnWire.classList.toggle('on', wireframe);
            applyWireframe(currentModel);
        });

        // ---- 截图 ----
        btnShot.addEventListener('click', () => {
            if (!currentModel) {
                setStatus('先加载一个模型', 'warning');
                return;
            }
            renderer.render(scene, camera);
            const url = renderer.domElement.toDataURL('image/png');
            const a = document.createElement('a');
            const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            a.download = 'web3d-' + stamp + '.png';
            a.href = url;
            a.click();
            setStatus('已保存截图', 'idle');
        });

        // ---- 全屏 ----
        btnFull.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
            } else {
                (document.exitFullscreen || function () {}).call(document);
            }
        });

        // ---- 拖拽加载 ----
        ['dragenter', 'dragover'].forEach(ev => {
            window.addEventListener(ev, (e) => {
                e.preventDefault();
                document.body.classList.add('dragging');
            });
        });
        ['dragleave', 'drop'].forEach(ev => {
            window.addEventListener(ev, (e) => {
                e.preventDefault();
                if (ev === 'dragleave' && e.relatedTarget) return;
                document.body.classList.remove('dragging');
            });
        });
        window.addEventListener('drop', (e) => {
            const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) loadZip(f);
        });

        // ---- 快捷键 ----
        window.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName) || '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
            const k = e.key.toLowerCase();
            if (k === 'r') { btnReset.click(); }
            else if (k === ' ') { e.preventDefault(); btnAuto.click(); }
            else if (k === 'g') { btnGrid.click(); }
            else if (k === 'w') { btnWire.click(); }
            else if (k === 'l') { btnDebug.click(); }
            else if (k === 's') { btnShot.click(); }
            else if (k === 'f') { btnFull.click(); }
        });

        // ============================================================
        //  自适应
        // ============================================================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            invalidate();
        });

        // ============================================================
        //  动画
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            // damping 未结束时 update() 返回 true，需要继续重绘
            const changed = controls.update();
            if (!changed && !needsRender) return;
            needsRender = false;
            renderer.render(scene, camera);
        }
        animate();

        setStatus('选择 ZIP 压缩包加载', 'idle');
        console.log('[Web3D Viewer] v1.0.1 | three r163 | CDN: ' + (window.__CDN_KEY__ || 'jsdelivr'));
        console.log(' 点击 "贴图" 查看纹理匹配日志');
    </script>
</body>
</html>
