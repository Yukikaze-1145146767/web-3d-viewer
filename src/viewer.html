<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Web3D Viewer — 单文件 OBJ 模型查看器</title>
    <meta name="description" content="单文件 Web 端 OBJ 模型查看器：把 .obj + .mtl + 贴图打包成 ZIP，浏览器打开即可预览，带贴图匹配日志。" />
    <meta property="og:title" content="Web3D Viewer — 单文件 OBJ 查看器" />
    <meta property="og:description" content="Drop a ZIP with .obj + .mtl + textures and preview it in the browser. Single HTML file, no build, no backend." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d14'/%3E%3Cpath d='M32 12 52 23v18L32 52 12 41V23z' fill='none' stroke='%236699ff' stroke-width='3'/%3E%3Cpath d='M12 23l20 11 20-11M32 34v18' fill='none' stroke='%236699ff' stroke-width='2.5' opacity='.75'/%3E%3C/svg%3E" />
    <style>
        :root {
            --bg: #141414;
            --panel: #1b1b1b;
            --panel-hi: #242424;
            --panel-hover: #2b2b2b;
            --line: #2c2c2c;
            --line-hi: #3a3a3a;
            --fg: #d6d6d6;
            --fg-dim: #8c8c8c;
            --fg-faint: #565656;
            --accent: #e07b39;
            --ok: #78a878;
            --warn: #cfa04a;
            --err: #cc5f5f;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            font-size: 13px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- canvas ---------- */
        #canvas-container { position: fixed; inset: 0; }
        #canvas-container canvas { display: block; touch-action: none; }
        dialog { margin: auto; padding: 20px; max-width: 90vw; color: var(--fg); background: var(--panel); border: 1px solid var(--line-hi); }
        dialog select { display: block; max-width: 75vw; margin: 16px 0; }
        dialog button { padding: 8px 14px; margin-right: 8px; }
        dialog::backdrop { background: #0009; }
        .btn:disabled { opacity: .5; cursor: wait; }
        .btn[hidden] { display: none; }
        body.dragging::after {
            content: '';
            position: fixed;
            inset: 8px;
            border: 1px dashed var(--accent);
            pointer-events: none;
            z-index: 500;
        }

        /* ---------- 顶部栏 ---------- */
        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            z-index: 200;
        }
        #topbar .brand {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .02em;
            color: var(--fg);
            white-space: nowrap;
        }
        #file-name {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--fg-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        #stats {
            margin-left: auto;
            display: flex;
            gap: 14px;
            font-size: 11px;
            color: var(--fg-dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        #stats b { color: var(--fg); font-weight: 500; }

        /* ---------- 底部栏 ---------- */
        #bottombar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--panel);
            border-top: 1px solid var(--line);
            z-index: 200;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #progress-wrap {
            height: 2px;
            background: #242424;
            opacity: 0;
            transition: opacity .2s;
        }
        #progress-wrap.active { opacity: 1; }
        #progress-bar {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width .15s linear;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .spacer { flex: 1; }

        /* ---------- 按钮 ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 30px;
            padding: 0 10px;
            background: var(--panel-hi);
            border: 1px solid var(--line-hi);
            border-radius: 2px;
            color: var(--fg);
            font-size: 12px;
            font-family: inherit;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
            transition: background .12s, border-color .12s, color .12s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background: var(--panel-hover); border-color: #484848; }
        .btn:active { background: #333; }
        .btn svg { width: 15px; height: 15px; flex: none; }
        .btn.icon { width: 32px; padding: 0; }
        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #141414;
            font-weight: 600;
        }
        .btn.primary:hover { background: #ea8a4b; border-color: #ea8a4b; }
        .btn.on {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ---------- 状态 ---------- */
        #status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--fg-dim);
            min-height: 14px;
            overflow: hidden;
        }
        #status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #status .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--ok);
            flex: none;
        }
        #status .dot.loading { background: var(--warn); }
        #status .dot.error { background: var(--err); }
        #status .dot.warning { background: var(--warn); }

        /* ---------- 空状态 ---------- */
        #empty-hint {
            position: fixed;
            inset: 44px 0 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--fg-faint);
            font-size: 13px;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #empty-hint svg { width: 44px; height: 44px; opacity: .5; }
        #empty-hint .sub { font-size: 11px; color: #464646; font-family: var(--mono); }

        /* ---------- 贴图日志面板 ---------- */
        #tex-log {
            position: fixed;
            top: 44px;
            right: 0;
            bottom: 0;
            width: 340px;
            max-width: 100%;
            background: var(--panel);
            border-left: 1px solid var(--line);
            overflow-y: auto;
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.55;
            z-index: 190;
            transform: translateX(100%);
            transition: transform .16s ease;
            overscroll-behavior: contain;
        }
        #tex-log.show { transform: translateX(0); }
        #tex-log div {
            padding: 3px 10px;
            border-bottom: 1px solid #202020;
            word-break: break-all;
            color: var(--fg-dim);
        }
        #tex-log .ok { color: var(--ok); }
        #tex-log .fail { color: var(--err); }
        #tex-log .info { color: var(--fg-faint); }

        #zip-input { display: none; }

        @media (max-width: 560px) {
            #topbar { height: 40px; gap: 8px; padding: 0 10px; }
            #topbar .brand { display: none; }
            #stats { gap: 10px; font-size: 10px; }
            #empty-hint { inset: 40px 0 0 0; }
            #tex-log { top: 40px; width: 100%; }
            .btn { height: 28px; padding: 0 8px; font-size: 11px; }
            .btn.icon { width: 30px; }
            .btn svg { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="empty-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
            <path d="M12 2.6 21 7.4v9.2L12 21.4 3 16.6V7.4z" />
            <path d="M3 7.4l9 4.8 9-4.8M12 12.2v9.2" opacity=".55" />
        </svg>
        <div>拖入 ZIP，或点击「打开 ZIP」</div>
        <div class="sub">.obj + .mtl + textures</div>
    </div>

    <header id="topbar">
        <div class="brand">Web3D Viewer</div>
        <div id="file-name">未加载</div>
        <div id="stats">
            <span>顶点 <b id="poly-count">0</b></span>
            <span>三角面 <b id="tri-count">0</b></span>
        </div>
    </header>

    <div id="tex-log"></div>

    <footer id="bottombar">
        <div id="progress-wrap"><div id="progress-bar"></div></div>
        <div class="bar-row">
            <button id="btn-load" class="btn primary" title="打开 ZIP">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                    <path d="M3 6.5h6l1.5 2H21v10H3z" />
                </svg>
                <span>打开 ZIP</span>
            </button>
            <button id="btn-cancel" class="btn" hidden>取消加载</button>
            <div class="spacer"></div>
            <button id="btn-grid" class="btn icon on" title="网格 (G)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18" />
                </svg>
            </button>
            <button id="btn-wire" class="btn icon" title="线框 (W)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                    <path d="M12 3l9 16H3z" />
                </svg>
            </button>
            <button id="btn-auto" class="btn icon" title="自动旋转 (空格)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M20 12a8 8 0 1 1-2.3-5.6" />
                    <path d="M20 4v4h-4" />
                </svg>
            </button>
            <button id="btn-reset" class="btn icon" title="重置视角 (R)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="2.4" />
                    <path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke-linecap="round" />
                </svg>
            </button>
            <button id="btn-shot" class="btn icon" title="截图 (S)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                    <path d="M3 8h4l1.6-2h6.8L17 8h4v11H3z" />
                    <circle cx="12" cy="13" r="3.2" />
                </svg>
            </button>
            <button id="btn-full" class="btn icon" title="全屏 (F)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
                </svg>
            </button>
            <button id="btn-debug" class="btn icon" title="贴图日志 (L)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M4 6h16M4 12h16M4 18h10" />
                </svg>
            </button>
        </div>
        <div id="status" role="status" aria-live="polite">
            <span class="dot"></span>
            <span id="status-text">就绪</span>
        </div>
    </footer>

    <input type="file" id="zip-input" accept=".zip" />

    <!-- Three.js 依赖源可用 ?cdn=jsdelivr|unpkg|npmmirror 切换；默认 jsDelivr -->
    <script>
        (function () {
            var SOURCES = {
                jsdelivr: 'https://cdn.jsdelivr.net/npm/three@0.163.0/',
                unpkg: 'https://unpkg.com/three@0.163.0/',
                npmmirror: 'https://registry.npmmirror.com/three/0.163.0/files/'
            };
            var ORDER = ['jsdelivr', 'unpkg', 'npmmirror'];
            var q = new URLSearchParams(location.search).get('cdn');
            var pick = SOURCES[q] ? q : ORDER[0];
            window.__CDN_KEY__ = pick;
            window.__CDN_ORDER__ = ORDER;
            document.write(
                '<script type="importmap">' +
                JSON.stringify({
                    imports: {
                        'three': SOURCES[pick] + 'build/three.module.js',
                        'three/addons/': SOURCES[pick] + 'examples/jsm/'
                    }
                }) +
                '<\/script>'
            );
        })();
    </script>

    <script type="module">
        // ============================================================
        //  模块导入
        // ============================================================
        // 动态导入：静态 import 失败时整个模块不执行、页面死寂无提示，这里换成可捕获的形式
        function showFatalLoad(err) {
            var cur = window.__CDN_KEY__ || 'jsdelivr';
            var alts = (window.__CDN_ORDER__ || []).filter(function (k) { return k !== cur; });
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(13,13,20,.96);z-index:9999;font-size:14px;line-height:1.7;';
            var title = document.createElement('div');
            title.style.cssText = 'font-size:16px;font-weight:600;color:#ff8a8a;';
            title.textContent = 'Three.js 加载失败';
            var detail = document.createElement('div');
            detail.style.cssText = 'max-width:460px;opacity:.82;';
            detail.textContent = '当前源：' + cur + '。可能是网络无法访问该 CDN。' +
                (err && err.message ? '错误：' + err.message : '');
            box.appendChild(title);
            box.appendChild(detail);
            alts.forEach(function (k) {
                var a = document.createElement('a');
                a.href = location.pathname + '?cdn=' + k;
                a.style.cssText = 'color:#8ab4ff;text-decoration:underline;';
                a.textContent = '用备用源重试：' + k;
                box.appendChild(a);
            });
            document.body.appendChild(box);
        }

        const objWorkerSource = __OBJ_WORKER_SOURCE__;
        let THREE, OrbitControls, MTLLoader, TGALoader, DDSLoader;
        try {
            [THREE, { OrbitControls }, { MTLLoader }] = await Promise.all([
                import('three'), import('three/addons/controls/OrbitControls.js'),
                import('three/addons/loaders/MTLLoader.js'),
            ]);
        } catch (err) {
            showFatalLoad(err);
            throw err;
        }

        // ============================================================
        //  DOM 引用
        // ============================================================
        const container = document.getElementById('canvas-container');
        const zipInput = document.getElementById('zip-input');
        const btnLoad = document.getElementById('btn-load');
        const btnCancel = document.getElementById('btn-cancel');
        const btnReset = document.getElementById('btn-reset');
        const btnAuto = document.getElementById('btn-auto');
        const btnDebug = document.getElementById('btn-debug');
        const statusText = document.getElementById('status-text');
        const statusDot = document.querySelector('#status .dot');
        const progressWrap = document.getElementById('progress-wrap');
        const progressBar = document.getElementById('progress-bar');
        const polyCountEl = document.getElementById('poly-count');
        const triCountEl = document.getElementById('tri-count');
        const emptyHint = document.getElementById('empty-hint');
        const texLog = document.getElementById('tex-log');
        const btnGrid = document.getElementById('btn-grid');
        const btnWire = document.getElementById('btn-wire');
        const btnShot = document.getElementById('btn-shot');
        const btnFull = document.getElementById('btn-full');
        const fileNameEl = document.getElementById('file-name');

        let texLogEntries = [];
        const TEX_LOG_KEEP = 500;   // 内存里保留的条数上限
        const TEX_LOG_RENDER = 40;  // 面板里渲染的条数
        let texLogPending = false;

        function logTex(msg, type = 'info') {
            texLogEntries.push({ msg, type });
            if (texLogEntries.length > TEX_LOG_KEEP) texLogEntries.shift();
            if (texLogPending) return;
            texLogPending = true;
            requestAnimationFrame(renderTexLog);
        }

        function renderTexLog() {
            texLogPending = false;
            const total = texLogEntries.length;
            const shown = texLogEntries.slice(-TEX_LOG_RENDER);
            const frag = document.createDocumentFragment();
            if (total > shown.length) {
                const head = document.createElement('div');
                head.className = 'info';
                head.textContent = `…共 ${total} 条，仅显示最后 ${shown.length} 条`;
                frag.appendChild(head);
            }
            for (const e of shown) {
                const row = document.createElement('div');
                row.className = e.type;
                // 用 textContent 而不是 innerHTML：ZIP 内的文件名可能带 HTML 标签
                row.textContent = e.msg;
                frag.appendChild(row);
            }
            texLog.replaceChildren(frag);
            texLog.scrollTop = texLog.scrollHeight;
        }

        // ============================================================
        //  Three.js 场景
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d14);

        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 500);
        camera.position.set(4, 3, 6);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance',
            preserveDrawingBuffer: false,
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 0.5;
        controls.maxDistance = 150;
        controls.target.set(0, 0, 0);
        controls.update();

        // ---- 灯光 ----
        const ambient = new THREE.AmbientLight(0x40406b, 0.6);
        scene.add(ambient);

        const main = new THREE.DirectionalLight(0xffeedd, 1.8);
        main.position.set(8, 12, 6);
        scene.add(main);

        const fill = new THREE.DirectionalLight(0x4488ff, 0.6);
        fill.position.set(-6, 4, -8);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffaa66, 0.4);
        rim.position.set(0, -6, 10);
        scene.add(rim);

        const hemi = new THREE.HemisphereLight(0x6699ff, 0x443366, 0.5);
        scene.add(hemi);

        const grid = new THREE.GridHelper(8, 16, 0x445577, 0x223355);
        grid.position.y = -0.5;
        scene.add(grid);

        // ============================================================
        //  状态
        // ============================================================
        let currentModel = null;
        let autoRotate = false;
        let isLoading = false;
        let activeTask = null;
        let workerRunning = false;
        let lastParse = null;

        let activeResources = null;
        // blob URL → { name, ext }，用于按扩展名选择纹理解码器
        const blobUrlMeta = new Map();
        // 按需渲染：只有视角或场景变化时才重绘
        let needsRender = true;
        let frame = 0;
        let lastFrameTime = null;
        const invalidate = () => {
            needsRender = true;
            if (!frame && !document.hidden) frame = requestAnimationFrame(animate);
        };

        const MAX_ZIP_BYTES = 300 * 1024 * 1024;
        const MAX_UNZIP_BYTES = 600 * 1024 * 1024;

        const cancelled = () => new DOMException('已取消加载', 'AbortError');
        function checkCancelled(signal) {
            if (signal.aborted) throw cancelled();
        }

        function abortable(promise, signal, disposeLateValue) {
            return new Promise((resolve, reject) => {
                let settled = false;
                const abort = () => { settled = true; reject(cancelled()); };
                signal.addEventListener('abort', abort, { once: true });
                promise.then(value => {
                    signal.removeEventListener('abort', abort);
                    if (settled) { disposeLateValue?.(value); return; }
                    settled = true;
                    resolve(value);
                }, error => {
                    signal.removeEventListener('abort', abort);
                    if (!settled) { settled = true; reject(error); }
                });
                if (signal.aborted) abort();
            });
        }

        async function parseObj(buffer, signal) {
            checkCancelled(signal);
            const started = performance.now();
            lastParse = { state: 'starting' };
            const url = URL.createObjectURL(new Blob([objWorkerSource], { type: 'text/javascript' }));
            let worker;
            let abort;
            try {
                worker = new Worker(url);
                workerRunning = true;
                const data = await new Promise((resolve, reject) => {
                    abort = () => reject(cancelled());
                    signal.addEventListener('abort', abort, { once: true });
                    worker.onerror = event => { event.preventDefault(); reject(new Error(`解析进程失败：${event.message}`)); };
                    worker.onmessageerror = () => reject(new Error('解析结果传输失败'));
                    worker.onmessage = ({ data }) => {
                        if (data.type === 'parsing') {
                            lastParse = { state: 'parsing' };
                            setStatus('解析模型中，可随时取消...', 'loading');
                        } else if (data.type === 'error') reject(new Error(data.message));
                        else if (data.type === 'complete') resolve(data);
                    };
                    worker.postMessage(buffer, [buffer]);
                });
                checkCancelled(signal);
                const rebuilt = performance.now();
                const model = new THREE.Group();
                const materials = data.materials.map(info => {
                    const Constructor = info.type === 'PointsMaterial' ? THREE.PointsMaterial
                        : info.type === 'LineBasicMaterial' ? THREE.LineBasicMaterial : THREE.MeshPhongMaterial;
                    const material = new Constructor();
                    material.name = info.name;
                    material.color.fromArray(info.color);
                    material.vertexColors = info.vertexColors;
                    if (material.isMeshPhongMaterial) material.flatShading = info.flatShading;
                    if (material.isPointsMaterial) {
                        material.size = info.size;
                        material.sizeAttenuation = info.sizeAttenuation;
                    }
                    return material;
                });
                const geometries = [];
                try {
                    for (const item of data.objects) {
                        const geometry = new THREE.BufferGeometry();
                        geometries.push(geometry);
                        for (const [name, attribute] of Object.entries(item.attributes)) {
                            geometry.setAttribute(name, new THREE.BufferAttribute(attribute.array, attribute.itemSize, attribute.normalized));
                        }
                        geometry.groups = item.groups;
                        geometry.boundingBox = new THREE.Box3(new THREE.Vector3().fromArray(item.box.min), new THREE.Vector3().fromArray(item.box.max));
                        geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3().fromArray(item.sphere.center), item.sphere.radius);
                        const material = Array.isArray(item.material) ? item.material.map(id => materials[id]) : materials[item.material];
                        const Constructor = item.type === 'Points' ? THREE.Points : item.type === 'LineSegments' ? THREE.LineSegments : THREE.Mesh;
                        const object = new Constructor(geometry, material);
                        object.name = item.name;
                        model.add(object);
                    }
                } catch (error) {
                    for (const geometry of geometries) geometry.dispose();
                    for (const material of materials) material.dispose();
                    throw error;
                }
                model.materialLibraries = data.libraries;
                lastParse = { state: 'complete', ...data.metrics, rebuildMs: performance.now() - rebuilt, totalMs: performance.now() - started };
                return model;
            } catch (error) {
                lastParse = { state: error.name === 'AbortError' ? 'cancelled' : 'failed', totalMs: performance.now() - started };
                throw error;
            } finally {
                signal.removeEventListener('abort', abort);
                worker?.terminate();
                workerRunning = false;
                URL.revokeObjectURL(url);
            }
        }

        // 视角变化时触发重绘
        controls.addEventListener('change', invalidate);

        // ============================================================
        //  工具
        // ============================================================
        function setStatus(msg, type = 'idle') {
            statusText.textContent = msg;
            statusDot.className = 'dot';
            if (type === 'loading') statusDot.classList.add('loading');
            if (type === 'error') statusDot.classList.add('error');
            if (type === 'warning') statusDot.classList.add('warning');
        }

        function setProgress(pct) {
            if (pct < 0) {
                progressWrap.classList.remove('active');
                return;
            }
            progressWrap.classList.add('active');
            progressBar.style.width = Math.min(pct, 100) + '%';
        }

        function updateStats(model) {
            if (!model) {
                polyCountEl.textContent = '0';
                triCountEl.textContent = '0';
                return;
            }
            let verts = 0,
                tris = 0;
            model.traverse(child => {
                if (child.isMesh && child.geometry) {
                    const g = child.geometry;
                    if (g.index) {
                        tris += g.index.count / 3;
                    } else if (g.attributes.position) {
                        tris += g.attributes.position.count / 3;
                    }
                    if (g.attributes.position) {
                        verts += g.attributes.position.count;
                    }
                }
            });
            polyCountEl.textContent = Math.round(verts).toLocaleString();
            triCountEl.textContent = Math.round(tris).toLocaleString();

            // 高面数模型降低渲染分辨率，避免移动端掉帧
            const ratio = tris > 500000 ? 1 : Math.min(window.devicePixelRatio, 2);
            if (renderer.getPixelRatio() !== ratio) {
                renderer.setPixelRatio(ratio);
                renderer.setSize(container.clientWidth, container.clientHeight);
                invalidate();
            }
        }

        const TEXTURE_SLOTS = ['map', 'bumpMap', 'normalMap', 'specularMap',
            'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap'];

        // material.dispose() 不会连带释放贴图，需要逐个 dispose
        function disposeMaterial(mat) {
            if (!mat) return;
            for (const slot of TEXTURE_SLOTS) {
                const tex = mat[slot];
                if (tex && typeof tex.dispose === 'function') {
                    tex.dispose();
                    mat[slot] = null;
                }
            }
            if (typeof mat.dispose === 'function') mat.dispose();
        }

        function disposeModel(model) {
            if (!model) return;
            const materials = new Set();
            const geometries = new Set();
            model.traverse(child => {
                if (child.geometry) geometries.add(child.geometry);
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const m of mats) if (m) materials.add(m);
            });
            for (const geometry of geometries) geometry.dispose();
            for (const material of materials) disposeMaterial(material);
            scene.remove(model);
        }

        function revokeBlobUrls(urls) {
            for (const url of urls) {
                URL.revokeObjectURL(url);
                blobUrlMeta.delete(url);
            }
        }

        // ============================================================
        //  动态加载 JSZip
        // ============================================================
        const JSZIP_CDNS = [
            'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
            'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
            'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
        ];

        function loadScriptFromAny(urls) {
            return new Promise((resolve, reject) => {
                const tryNext = (i) => {
                    if (i >= urls.length) {
                        reject(new Error('JSZip 加载失败：所有 CDN 均不可达'));
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = urls[i];
                    script.onload = () => resolve();
                    script.onerror = () => {
                        script.remove();
                        tryNext(i + 1);
                    };
                    document.head.appendChild(script);
                };
                tryNext(0);
            });
        }

        let jsZipReady;
        function loadJSZip() {
            if (window.JSZip) return Promise.resolve();
            if (!jsZipReady) jsZipReady = loadScriptFromAny(JSZIP_CDNS).catch(error => { jsZipReady = null; throw error; });
            return jsZipReady;
        }

        const TEXTURE_EXT_RE = /\.(jpg|jpeg|png|bmp|webp|gif|tga|dds)$/;

        function normalizePath(path) {
            const result = [];
            for (const part of path.replace(/\\/g, '/').split('/')) {
                if (!part || part === '.') continue;
                if (part === '..') result.pop();
                else result.push(part);
            }
            return result.join('/');
        }

        function resolveAsset(reference, parent, names) {
            const clean = reference.trim().replace(/^["']|["']$/g, '');
            const relative = normalizePath(parent.slice(0, parent.lastIndexOf('/') + 1) + clean);
            if (names.includes(relative)) return relative;
            const folded = names.filter(name => name.toLowerCase() === relative.toLowerCase());
            if (folded.length === 1) return folded[0];
            const base = normalizePath(clean).split('/').pop().toLowerCase();
            const candidates = names.filter(name => name.split('/').pop().toLowerCase() === base);
            if (candidates.length === 1) return candidates[0];
            throw new Error(candidates.length > 1 ? `资源路径有歧义：${reference}` : `资源缺失：${reference}`);
        }

        function releaseResources(resources) {
            if (!resources) return;
            for (const material of resources.materials) disposeMaterial(material);
            for (const texture of resources.textures) texture.dispose();
            revokeBlobUrls(resources.urls);
            resources.materials.clear();
            resources.textures.clear();
            resources.decoded.clear();
        }

        async function unzipFile(file, signal) {
            await abortable(loadJSZip(), signal);
            const data = await abortable(file.arrayBuffer(), signal);
            const zip = await abortable(window.JSZip.loadAsync(data), signal);
            checkCancelled(signal);
            const files = new Map();
            const resources = { urls: [], materials: new Set(), textures: new Set(), decoded: new Map(), pixels: 0 };
            let totalBytes = 0;
            const names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
            if (names.length > 10000) throw new Error('ZIP 文件数量超过 10000');
            for (const name of names) {
                const normalized = normalizePath(name);
                if (files.has(normalized)) throw new Error(`ZIP 路径重复：${normalized}`);
                files.set(normalized, zip.files[name]);
            }
            const read = async (name, text = false) => {
                checkCancelled(signal);
                const entry = files.get(name);
                if (!entry) throw new Error(`资源缺失：${name}`);
                const limit = 128 * 1024 * 1024;
                const chunks = [];
                let size = 0;
                await new Promise((resolve, reject) => {
                    const stream = entry.internalStream('uint8array');
                    let settled = false;
                    const finish = error => {
                        if (settled) return;
                        settled = true;
                        signal.removeEventListener('abort', abort);
                        if (error) { stream.pause(); chunks.length = 0; reject(error); }
                        else resolve();
                    };
                    const abort = () => finish(cancelled());
                    signal.addEventListener('abort', abort, { once: true });
                    stream.on('data', chunk => {
                        if (settled) return;
                        size += chunk.length;
                        totalBytes += chunk.length;
                        if (size > limit || totalBytes > MAX_UNZIP_BYTES) {
                            finish(new Error(`解压资源超限：${name}（单文件 128 MiB，总量 600 MiB）`));
                            return;
                        }
                        chunks.push(chunk);
                    }).on('error', finish).on('end', () => finish()).resume();
                });
                checkCancelled(signal);
                const blob = new Blob(chunks);
                if (text === 'buffer') return abortable(blob.arrayBuffer(), signal);
                if (text) return abortable(blob.text(), signal);
                const url = URL.createObjectURL(blob);
                resources.urls.push(url);
                blobUrlMeta.set(url, { name, ext: name.toLowerCase().split('.').pop() });
                return url;
            };
            return { files, resources, read, signal };
        }

        async function decodeTexture(name, archive) {
            const { resources, signal } = archive;
            checkCancelled(signal);
            if (resources.decoded.has(name)) return resources.decoded.get(name);
            const promise = (async () => {
                const url = await archive.read(name);
                const ext = blobUrlMeta.get(url).ext;
                if (ext === 'tga' && !TGALoader) ({ TGALoader } = await abortable(import('three/addons/loaders/TGALoader.js'), signal));
                if (ext === 'dds' && !DDSLoader) ({ DDSLoader } = await abortable(import('three/addons/loaders/DDSLoader.js'), signal));
                checkCancelled(signal);
                const loader = ext === 'tga' ? new TGALoader() : ext === 'dds' ? new DDSLoader() : new THREE.TextureLoader();
                let texture;
                try {
                    texture = await abortable(loader.loadAsync(url), signal, texture => texture.dispose());
                } catch (error) {
                    if (error.name === 'AbortError') throw error;
                    throw new Error(`贴图解码失败：${name}${error?.message ? `（${error.message}）` : ''}`);
                }
                resources.textures.add(texture);
                const { width, height } = texture.image;
                if (!width || !height || Math.max(width, height) > renderer.capabilities.maxTextureSize) {
                    throw new Error(`纹理尺寸不受设备支持：${name} (${width}×${height})`);
                }
                resources.pixels += width * height;
                if (resources.pixels > 32 * 1024 * 1024) throw new Error('纹理总像素超过 32 MiPixels，请降低贴图分辨率');
                return texture;
            })();
            resources.decoded.set(name, promise);
            return promise;
        }

        // ============================================================
        //  加载 ZIP
        // ============================================================
        async function loadZip(file) {
            if (isLoading) return;

            if (file.size > MAX_ZIP_BYTES) {
                setStatus(`ZIP 超过 ${MAX_ZIP_BYTES / 1024 / 1024} MB，请精简后再试`, 'error');
                return;
            }

            isLoading = true;
            const task = new AbortController();
            activeTask = task;
            const { signal } = task;
            btnLoad.disabled = true;
            btnCancel.hidden = false;
            texLogEntries = [];
            renderTexLog();
            if (file.size > 80 * 1024 * 1024) {
                logTex(`ZIP 体积 ${(file.size / 1024 / 1024).toFixed(0)} MB，移动端解析可能因内存不足失败`, 'fail');
            }
            setStatus('解压中...', 'loading');
            setProgress(10);

            let pending = null;
            let obj = null;
            let committed = false;
            try {
                pending = await unzipFile(file, signal);
                const names = [...pending.files.keys()];
                const objNames = names.filter(name => /\.obj$/i.test(name));
                if (!objNames.length) throw new Error('ZIP 中没有 .obj 文件');
                const objName = await chooseModel(objNames, signal);
                const objBuffer = await pending.read(objName, 'buffer');
                setStatus('解析模型...', 'loading');
                setProgress(35);
                obj = await parseObj(objBuffer, signal);
                const mats = await loadMaterials(obj, objName, pending);
                checkCancelled(signal);
                applyMaterials(obj, mats, pending.resources);
                setProgress(80);
                const box = new THREE.Box3().setFromObject(obj);
                if (box.isEmpty() || ![...box.min.toArray(), ...box.max.toArray()].every(Number.isFinite)) {
                    throw new Error('模型为空或包含无效坐标');
                }
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                obj.position.sub(center);
                const maxDim = Math.max(size.x, size.y, size.z);
                grid.position.y = (box.min.y - center.y) - maxDim * 0.02;
                grid.scale.setScalar(Math.max(maxDim / 8, 0.001));
                fitCamera(obj);

                disposeModel(currentModel);
                releaseResources(activeResources);
                activeResources = pending.resources;
                scene.add(obj);
                currentModel = obj;
                committed = true;
                fileNameEl.textContent = `${file.name} / ${objName}`;
                fileNameEl.title = fileNameEl.textContent;
                invalidate();

                updateStats(obj);
                if (wireframe) applyWireframe(obj);
                setProgress(100);

                const failures = texLogEntries.filter(entry => entry.type === 'fail').length;
                setStatus(`${mats.size} 材质 · ${pending.resources.decoded.size} 张贴图${failures ? ` · ${failures} 项警告（见日志）` : ''}`, failures ? 'warning' : 'idle');
                emptyHint.style.display = 'none';
            } catch (err) {
                if (!committed) {
                    disposeModel(obj);
                    releaseResources(pending?.resources);
                }
                setStatus('' + err.message, err.name === 'AbortError' ? 'warning' : 'error');
            } finally {
                setProgress(-1);
                isLoading = false;
                btnLoad.disabled = false;
                btnCancel.hidden = true;
                activeTask = null;
            }
        }

        function chooseModel(names, signal) {
            checkCancelled(signal);
            if (names.length === 1) return Promise.resolve(names[0]);
            return new Promise((resolve, reject) => {
                const dialog = document.createElement('dialog');
                const title = document.createElement('p');
                title.textContent = '选择要打开的 OBJ 模型';
                const select = document.createElement('select');
                select.setAttribute('aria-label', 'OBJ 模型');
                for (const name of names) select.add(new Option(name, name));
                const open = document.createElement('button');
                open.textContent = '打开模型';
                const cancel = document.createElement('button');
                cancel.textContent = '取消';
                const finish = (value) => {
                    signal.removeEventListener('abort', abort);
                    dialog.close(); dialog.remove();
                    if (value) resolve(value); else reject(cancelled());
                };
                const abort = () => finish(null);
                signal.addEventListener('abort', abort, { once: true });
                open.onclick = () => finish(select.value);
                cancel.onclick = () => finish(null);
                dialog.oncancel = event => { event.preventDefault(); finish(null); };
                dialog.append(title, select, open, cancel);
                document.body.append(dialog);
                dialog.showModal();
            });
        }

        function fitCamera(model) {
            const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
            const radius = Math.max(sphere.radius, 0.0001);
            const vertical = THREE.MathUtils.degToRad(camera.fov) / 2;
            const horizontal = Math.atan(Math.tan(vertical) * camera.aspect);
            const distance = radius / Math.sin(Math.min(vertical, horizontal)) * 1.15;
            camera.position.copy(sphere.center).add(new THREE.Vector3(0.7, 0.5, 1).normalize().multiplyScalar(distance));
            camera.near = radius / 1000;
            camera.far = distance + radius * 100;
            camera.updateProjectionMatrix();
            controls.minDistance = radius * 0.01;
            controls.maxDistance = distance * 10;
            controls.target.copy(sphere.center);
            controls.update();
            invalidate();
        }

        // ============================================================
        //  解析 MTL (带日志)
        // ============================================================
        async function loadMaterials(obj, objName, archive) {
            checkCancelled(archive.signal);
            const names = [...archive.files.keys()];
            const mtlNames = names.filter(name => /\.mtl$/i.test(name));
            const textureNames = names.filter(name => TEXTURE_EXT_RE.test(name.toLowerCase()));
            const used = new Set();
            obj.traverse(child => {
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                for (const material of materials) if (material?.name) used.add(material.name);
            });
            const mats = new Map();
            const libraries = new Set();
            for (const reference of obj.materialLibraries) {
                libraries.add(resolveAsset(reference, objName, mtlNames));
            }
            if (!libraries.size && mtlNames.length === 1) {
                libraries.add(mtlNames[0]);
                logTex(`OBJ 未声明 mtllib，使用唯一材质库：${mtlNames[0]}`, 'info');
            }
            for (const name of libraries) {
                checkCancelled(archive.signal);
                const text = await archive.read(name, true);
                const creator = new MTLLoader().parse(text.replace(/^(\S+)\t+/gm, '$1 '), '');
                // 材质表使用无原型对象，允许 constructor 等合法材质名称。
                creator.materials = Object.create(null);
                const jobs = [];
                creator.loadTexture = reference => {
                    const texture = new THREE.Texture();
                    archive.resources.textures.add(texture);
                    jobs.push({ reference, texture });
                    return texture;
                };
                for (const materialName of used) {
                    if (!Object.hasOwn(creator.materialsInfo, materialName)) continue;
                    if (mats.has(materialName)) throw new Error(`多个 MTL 定义了同名材质：${materialName}`);
                    const info = creator.materialsInfo[materialName];
                    info.norm ??= info.map_kn ?? info.map_normal;
                    info.map_d ??= info.map_alpha;
                    if (info.norm === undefined) delete info.norm;
                    if (info.map_d === undefined) delete info.map_d;
                    const material = creator.create(materialName);
                    archive.resources.materials.add(material);
                    mats.set(materialName, material);
                }
                // 顺序解码避免大量图片同时占用临时内存；同源纹理只解码一次。
                for (const { reference, texture } of jobs) {
                    checkCancelled(archive.signal);
                    const path = resolveAsset(reference, name, textureNames);
                    setStatus(`加载贴图：${path}`, 'loading');
                    const source = await decodeTexture(path, archive);
                    const repeat = texture.repeat.clone(), offset = texture.offset.clone();
                    const { colorSpace, wrapS, wrapT } = texture;
                    texture.copy(source);
                    if (source.isCompressedTexture) texture.isCompressedTexture = true;
                    if (source.isDataTexture) texture.isDataTexture = true;
                    texture.repeat.copy(repeat);
                    texture.offset.copy(offset);
                    Object.assign(texture, { colorSpace, wrapS, wrapT });
                    texture.needsUpdate = true;
                    logTex(`${name} → ${path}`, 'ok');
                }
            }
            return mats;
        }

        let wireframe = false;

        function applyWireframe(model) {
            if (!model) return;
            model.traverse(child => {
                if (!child.isMesh) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const m of mats) {
                    if (m) m.wireframe = wireframe;
                }
            });
            invalidate();
        }

        function applyMaterials(obj, mats, resources) {
            const warned = new Set();
            const replaced = new Set();
            const variants = new Map();
            obj.traverse(child => {
                if (child.isMesh) {
                    const replace = old => {
                        const material = mats.get(old.name);
                        if (!material) {
                            if (old.name && !warned.has(old.name)) {
                                warned.add(old.name);
                                logTex(`材质缺失：${old.name}，保留默认材质`, 'fail');
                            }
                            return old;
                        }
                        const key = JSON.stringify([old.name, old.flatShading, old.vertexColors]);
                        if (!variants.has(key)) {
                            const variant = material.clone();
                            variant.flatShading = old.flatShading;
                            variant.vertexColors = old.vertexColors;
                            resources.materials.add(variant);
                            variants.set(key, variant);
                        }
                        replaced.add(old);
                        return variants.get(key);
                    };
                    child.material = Array.isArray(child.material) ? child.material.map(replace) : replace(child.material);
                }
            });
            for (const material of replaced) disposeMaterial(material);
        }

        // ============================================================
        //  事件
        // ============================================================
        btnLoad.addEventListener('click', () => {
            zipInput.click();
        });
        btnCancel.addEventListener('click', () => activeTask?.abort());

        zipInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadZip(e.target.files[0]);
            }
            zipInput.value = '';
        });

        btnReset.addEventListener('click', () => {
            if (currentModel) {
                fitCamera(currentModel);
            } else {
                camera.position.set(4, 3, 6);
                controls.target.set(0, 0, 0);
                controls.update();
            }
            setStatus('视角已重置', 'idle');
            invalidate();
        });

        btnAuto.addEventListener('click', () => {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 2.0;
            btnAuto.classList.toggle('on', autoRotate);
            invalidate();
        });

        // ---- 贴图调试按钮 ----
        btnDebug.addEventListener('click', () => {
            const on = texLog.classList.toggle('show');
            btnDebug.classList.toggle('on', on);
        });

        // ---- 网格开关 ----
        btnGrid.addEventListener('click', () => {
            grid.visible = !grid.visible;
            btnGrid.classList.toggle('on', grid.visible);
            invalidate();
        });

        // ---- 线框 ----
        btnWire.addEventListener('click', () => {
            wireframe = !wireframe;
            btnWire.classList.toggle('on', wireframe);
            applyWireframe(currentModel);
        });

        // ---- 截图 ----
        btnShot.addEventListener('click', () => {
            if (!currentModel) {
                setStatus('先加载一个模型', 'warning');
                return;
            }
            renderer.render(scene, camera);
            renderer.domElement.toBlob(blob => {
                if (!blob) { setStatus('截图失败', 'error'); return; }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                a.download = 'web3d-' + stamp + '.png';
                a.href = url;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                setStatus('已生成截图', 'idle');
            }, 'image/png');
        });

        // ---- 全屏 ----
        btnFull.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
            } else {
                (document.exitFullscreen || function () {}).call(document);
            }
        });

        // ---- 拖拽加载 ----
        ['dragenter', 'dragover'].forEach(ev => {
            window.addEventListener(ev, (e) => {
                e.preventDefault();
                document.body.classList.add('dragging');
            });
        });
        ['dragleave', 'drop'].forEach(ev => {
            window.addEventListener(ev, (e) => {
                e.preventDefault();
                if (ev === 'dragleave' && e.relatedTarget) return;
                document.body.classList.remove('dragging');
            });
        });
        window.addEventListener('drop', (e) => {
            const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) loadZip(f);
        });

        // ---- 快捷键 ----
        window.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName) || '';
            if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(tag) || e.target?.isContentEditable || document.querySelector('dialog[open]') || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
            const k = e.key.toLowerCase();
            if (k === 'r') { btnReset.click(); }
            else if (k === ' ') { e.preventDefault(); btnAuto.click(); }
            else if (k === 'g') { btnGrid.click(); }
            else if (k === 'w') { btnWire.click(); }
            else if (k === 'l') { btnDebug.click(); }
            else if (k === 's') { btnShot.click(); }
            else if (k === 'f') { btnFull.click(); }
        });

        // ============================================================
        //  自适应
        // ============================================================
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            invalidate();
        });

        // ============================================================
        //  动画
        // ============================================================
        function animate(time) {
            frame = 0;
            // damping 未结束时 update() 返回 true，需要继续重绘
            const delta = lastFrameTime === null ? 0 : Math.min((time - lastFrameTime) / 1000, 0.1);
            lastFrameTime = time;
            const changed = controls.update(delta);
            if (!changed && !needsRender) { lastFrameTime = null; return; }
            needsRender = false;
            renderer.render(scene, camera);
            if (changed || autoRotate) invalidate();
            else lastFrameTime = null;
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { cancelAnimationFrame(frame); frame = 0; lastFrameTime = null; }
            else invalidate();
        });
        controls.addEventListener('start', invalidate);
        invalidate();

        // 只读诊断接口，方便排查模型分组、贴图和 GPU 资源占用。
        window.web3d = Object.freeze({
            getDiagnostics() {
                const meshes = [];
                const primitives = [];
                currentModel?.traverse(child => {
                    if (child.geometry) primitives.push({ type: child.type, name: child.name, vertices: child.geometry.attributes.position.count, attributes: Object.keys(child.geometry.attributes) });
                    if (!child.isMesh) return;
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    meshes.push({
                        name: child.name,
                        groups: child.geometry.groups.map(group => ({ ...group })),
                        materials: materials.map(material => ({
                            name: material.name, type: material.type,
                            color: material.color?.getHex(), flatShading: material.flatShading, vertexColors: material.vertexColors,
                            maps: Object.fromEntries(TEXTURE_SLOTS.filter(slot => material[slot]).map(slot => {
                                const texture = material[slot];
                                return [slot, { colorSpace: texture.colorSpace, repeat: texture.repeat.toArray(), offset: texture.offset.toArray(), width: texture.image?.width, height: texture.image?.height, source: texture.source.uuid }];
                            })),
                        })),
                    });
                });
                return { loading: isLoading, workerRunning, lastParse: lastParse ? { ...lastParse } : null, scheduled: !!frame, frame: renderer.info.render.frame,
                    memory: { ...renderer.info.memory }, drawCalls: renderer.info.render.calls,
                    blobUrls: blobUrlMeta.size, decodedTextures: activeResources?.decoded.size || 0,
                    meshes, primitives, camera: { position: camera.position.toArray(), near: camera.near, far: camera.far, aspect: camera.aspect },
                };
            },
        });

        setStatus('选择 ZIP 压缩包加载', 'idle');
        console.log('[Web3D Viewer] v1.2.0 | three r163 | CDN: ' + (window.__CDN_KEY__ || 'jsdelivr'));
        console.log(' 点击 "贴图" 查看纹理匹配日志');
    </script>
</body>
</html>
