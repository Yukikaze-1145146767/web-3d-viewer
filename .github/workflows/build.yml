name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest moved to 26.04, which playwright 1.56 does not support yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify index.html matches sources
        run: node scripts/build.mjs --check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          BROWSER_CHANNEL: chromium
        run: node --test tests/viewer.test.mjs
